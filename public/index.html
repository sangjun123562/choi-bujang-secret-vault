<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 11단계 나만의 접속 앱</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101a28">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .card { margin: 24px 0; padding: 20px; border: 1px solid #334d6e; border-radius: 14px; background: #162436; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin-top: 12px; }
    .auth-form input { padding: 10px 12px; border-radius: 8px; border: 1px solid #4a6382; background: #0c1521; color: #fff; font-size: 15px; }
    .auth-buttons { display: flex; gap: 8px; }
    button { cursor: pointer; padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 15px; }
    .btn-primary { background: #3ecf8e; color: #082116; }
    .btn-secondary { background: #2d425b; color: #ecf4ff; }
    .btn-warning { background: #eab308; color: #1e1b4b; }
    .auth-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .error-msg { margin-top: 10px; color: #ff8b9e; font-size: 14px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .badge-denied { background: #612a35; color: #ff8b9e; border: 1px solid #d07384; }
    .badge-approved { background: #134e48; color: #5eead4; border: 1px solid #0f766e; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; margin-top: 24px; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; word-break: break-word; }
    .offline-banner { display: none; padding: 12px; background: #78350f; color: #fef3c7; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div id="offline-banner" class="offline-banner">오프라인 상태입니다. 네트워크 연결을 확인해 주세요.</div>
    <div class="eyebrow">11단계 나만의 접속 앱</div>
    <h1>최 부장의 비밀 자료실</h1>
    <p>설치 여부와 무관하게 서버와 정책 판정기의 엄격한 기기 승인을 거친 기기만 보호 자료를 열람할 수 있습니다.</p>

    <!-- 1. 계정 인증 영역 -->
    <div class="card" id="auth-section">
      <div id="logged-out-view">
        <strong>사용자 로그인</strong>
        <p style="font-size:14px; margin: 4px 0 12px;">자료실을 사용하려면 먼저 계정으로 로그인하세요.</p>
        <div class="auth-form">
          <input type="email" id="email" placeholder="이메일">
          <input type="password" id="password" placeholder="비밀번호">
          <div class="auth-buttons">
            <button class="btn-primary" id="btn-login">로그인</button>
            <button class="btn-secondary" id="btn-signup">회원가입</button>
          </div>
        </div>
        <div id="auth-error" class="error-msg"></div>
      </div>

      <div id="logged-in-view" class="hidden">
        <div class="auth-status">
          <span id="user-display">로그인됨</span>
          <button class="btn-secondary" id="btn-logout">로그아웃</button>
        </div>
      </div>
    </div>

    <!-- 2. 기기 승인 상태 영역 (승인 전에는 자료를 노출하지 않음) -->
    <div class="card" id="device-section">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong>기기 보안 승인 상태</strong>
          <div style="font-size:14px; color:#bfd0e5; margin-top:4px;">
            앱 설치 표시나 클라이언트 버튼만으로는 승인되지 않으며, 서버의 정식 승인 응답이 필요합니다.
          </div>
        </div>
        <div id="device-status-badge" class="badge badge-denied">미승인 기기 (접근 차단)</div>
      </div>

      <div id="device-action-box" style="margin-top: 16px;">
        <button class="btn-warning" id="btn-request-device-auth">기기 승인 확인</button>
        <span id="device-msg" style="margin-left: 12px; font-size: 14px; color: #ff8b9e;">서버 승인 계약 대기 중 (승인 전 자료 격리)</span>
      </div>
    </div>

    <!-- 3. 보호 자료실 영역 (승인 전 목록을 비우고 완전히 숨김) -->
    <div id="vault-section" class="hidden">
      <h2>승인된 보호 메모 목록</h2>
      <ul id="memo-list"></ul>
    </div>
  </main>

  <script>
    // 오프라인 상태 감지 UI
    function updateOnlineStatus() {
      const banner = document.getElementById('offline-banner');
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    const deviceBadge = document.getElementById('device-status-badge');
    const vaultSection = document.getElementById('vault-section');
    const memoList = document.getElementById('memo-list');
    const deviceMsg = document.getElementById('device-msg');
    const btnRequestDevice = document.getElementById('btn-request-device-auth');

    // 승인 전 목록 격리: 목록을 완전히 비우고 숨김 유지
    function clearAndHideVault() {
      deviceBadge.className = 'badge badge-denied';
      deviceBadge.textContent = '미승인 기기 (접근 차단)';
      vaultSection.classList.add('hidden');
      memoList.innerHTML = '';
    }

    // 서버 승인 확인과 자료 조회를 엄격히 분리
    async function checkDeviceApproval() {
      // 1. 승인 전에는 자료실을 열지 않고 비워둠
      clearAndHideVault();

      // docs/DECIDER_REQUEST.md에 명시되었듯 현재 서버 승인 API 계약은 미제공 상태
      // 임의로 메모 조회 API나 가상 URL을 호출해 상태 코드만으로 승인 처리하지 않음
      deviceMsg.style.color = '#ff8b9e';
      deviceMsg.textContent = '저장소 계약상 별도의 기기 승인 API가 아직 제공되지 않았습니다. 임의 승인 처리를 금지하며 대기 상태를 유지합니다.';
    }

    // 서버가 명시적으로 승인 성공을 응답했을 때만 호출되는 안전한 자료 조회 및 렌더링 함수
    async function loadVaultAfterApproval(token) {
      if (!token) return;
      try {
        const res = await fetch('/api/memos/SAMPLE_NOTE_1', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const item = await res.json();
          renderNotes(item ? [item] : []);
          vaultSection.classList.remove('hidden');
        }
      } catch (_) {}
    }

    function renderNotes(notes) {
      memoList.innerHTML = '';
      if (!Array.isArray(notes) || notes.length === 0) return;

      for (const note of notes) {
        const li = document.createElement('li');
        const strong = document.createElement('strong');
        strong.textContent = String(note.title ?? '무제');
        const span = document.createElement('span');
        span.textContent = String(note.body ?? note.content ?? '');
        li.appendChild(strong);
        li.appendChild(span);
        memoList.appendChild(li);
      }
    }

    btnRequestDevice.addEventListener('click', checkDeviceApproval);
    clearAndHideVault();
  </script>
</body>
</html>
